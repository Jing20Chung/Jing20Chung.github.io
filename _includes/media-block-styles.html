<style>
    *, *::before, *::after {
        box-sizing: border-box;
    }

    html, body {
        overflow-x: hidden;
    }

    :root {
        --lego-red: #d0011b;
        --lego-blue: #0055ad;
        --lego-yellow: #ffcf00;
        --lego-green: #237841;
    }
    
    .sticky-container {
        height: var(--scroll-h, 800px);
        position: relative;
    }
    
    .sticky-block {
        position: sticky;
        top: 15%;
        opacity: 0;
        transition: opacity 0.4s ease-out, transform 0.4s ease-out;
    }
    
    .sticky-block.fade-in { opacity: 1; transform: translateY(0); }
    .sticky-block.fade-out { opacity: 0; transform: translateY(-20px); }
    
    .lego-container {
        width: 100%;
        margin-bottom: var(--margin-bottom, 40px);
    }

    .lego-container.sticky-container {
        display: block !important;
        height: var(--scroll-h, 800px);
        position: relative;
        width: 100%;
    }
    
    .lego-wrapper {
        width: 100%;
        transform: translateX(clamp(-20vw, var(--lego-left, 0), 20vw));
        transition: transform 0.4s ease;
    }

    .lego-wrapper.sticky-block {
        width: var(--lego-w, 100%);
        height: auto;
    }
    
    .lego-link-wrapper {
        text-decoration: none;
        display: block;
        width: 100%;
        color: inherit;
    }
    
    .lego-brick {
        width: 100%;
        padding: 40px;
        border-radius: 24px;
        background: var(--lego-color);
        display: flex;
        flex-direction: column;
        gap: 30px;
        box-shadow:
            inset 5px 5px 0 rgba(255,255,255,0.3),
            inset -5px -5px 0 rgba(0,0,0,0.2),
            0 10px 20px rgba(0,0,0,0.15);
    }
    
    .lego-brick::after {
        content: "";
        position: absolute;
        top: -12px;
        left: 40px;
        right: 40px;
        height: 12px;
        background-image: 
            radial-gradient(circle, rgba(255,255,255, 0.4) 20%, transparent 25%),
            radial-gradient(circle, rgba(0,0,0, 0.1) 45%, transparent 50%);
        background-size: 44px 44px;
        background-repeat: repeat-x;
    }
    
    .lego-brick.is-clickable {
        cursor: pointer;
        transition: transform 0.15s ease, filter 0.15s ease;
    }
    
    .lego-brick.is-clickable:hover { filter: brightness(1.05); }
    .lego-brick.is-clickable:active { transform: translateY(4px); }
    .lego-brick.is-clickable:active::after { transform: translateY(-2px); }
    
    .lego-row {
        display: flex;
        flex-wrap: wrap;
        align-items: stretch;
        gap: var(--gap, 20px);
        margin-bottom: 40px;
    }
    .lego-row .lego-container {
        flex: 0 0 var(--lego-w, 100%);
        max-width: var(--lego-w, 100%);
        height: var(--lego-h, auto);
        display: flex;
        flex-direction: column;
    }

    .lego-row .lego-container .lego-wrapper {
        flex: 1;
        display: flex;
        flex-direction: column;
    }

    .lego-row .lego-container .lego-brick {
        flex: 1;
    }

    .lego-media-section {
        width: 100%;
    }
    
    .lego-media-element, .video-responsive {
        width: 100%;
        border-radius: 12px;
        display: block;
    }
    
    .video-responsive {
        position: relative;
        aspect-ratio: 16 / 9;
    }
    
    .video-responsive iframe {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
    }
    
    .lego-title {
        font-family: "Arial Black", sans-serif;
        font-size: clamp(32px, 5vw, 60px);
        margin: 0 0 15px 0;
        text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.2);
        text-align: center;
    }

    .lego-modal-window .lego-title {
        font-family: "Arial Black", sans-serif;
        font-size: clamp(32px, 5vw, 60px);
        margin: 0 0 15px 0;
        text-shadow: 1px 1px 2px rgba(255, 255, 255, 1);
        text-align: center;
        color:white;
        border-bottom: none;
    }
    
    .lego-body p {
        font-size: 1.1rem;
        line-height: 1.6;
    }
    
    .lego-brick .lego-title, 
    .lego-brick .lego-body, 
    .lego-brick .lego-body p,
    .lego-modal-window .lego-body p {
        color: white;
        text-align: var(--lego-align, left);
    }

    .lego-body summary {
        display: inline-block;
        padding: 8px 16px;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 12px;
        cursor: pointer;
        transition: all 0.2s ease;
        border: 1px solid rgba(255, 255, 255, 0.3);
        font-size: 0.9rem;
    }

    .lego-body summary:hover {
        background: rgba(255, 255, 255, 0.4);
        transform: scale(1.05);
    }

    .lego-body details[open] div {
        animation: slideDown 0.3s ease-out;
    }

    .lego-body details[open] summary {
        display: none;
    }

    .lego-body details[open] .extended-content {
        animation: fadeIn 0.5s ease-out;
    }

    .lego-modal-overlay {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        z-index: 9999;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }

    .lego-modal-overlay.is-active { display: flex; }

    .lego-modal-bg {
        position: absolute;
        width: 100%; height: 100%;
        background: rgba(0, 0, 0, 0.8);
        backdrop-filter: blur(8px);
    }

    .lego-modal-window {
        overscroll-behavior: contain;
        position: relative;
        background-color: var(--lego-color);
        width: 100%;
        max-width: 900px;
        max-height: 90vh;
        border-radius: 32px;
        z-index: 10000;
        overflow-y: auto;
        padding: 50px;
        box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        animation: legoPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .lego-modal-close {
        position: absolute;
        top: 20px; right: 25px;
        font-size: 40px; color: white;
        background: none; border: none; cursor: pointer;
        z-index: 10001;
    }

    @keyframes legoPop {
        from { transform: scale(0.8); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
    }

    .lego-modal-body, .lego-modal-body p, .lego-modal-body li {
        color: white !important;
    }

    @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
    }

    @keyframes slideDown {
        from { opacity: 0; transform: translateY(-10px); }
        to { opacity: 1; transform: translateY(0); }
    }
    
    @media (min-width: 860px) {
        .lego-brick.has-media {
            flex-direction: row;
            align-items: center;
        }

        .lego-brick.is-reversed {
            flex-direction: row-reverse;
        }

        .lego-media-section {
            flex: 0 0 var(--img-w, 50%);
            max-width: var(--img-w, 50%);
        }

        .lego-content-section {
            flex: 1;
        }
    }

    @media (max-width: 859px) {

        .lego-wrapper {
            width: 100% !important;
            transform: none !important;
        }

        .lego-row {
            flex-direction: column;
        }

        .lego-row .lego-container {
            flex: 0 0 100%;
            max-width: 100%;
        }

    }

    </style>
