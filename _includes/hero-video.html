{% if page.video %}
<div class="video-hero">
  <video id="heroVideo" muted playsinline loop autoplay>
    <source src="{{ page.video | relative_url }}" type="video/mp4">
    Your browser does not support the video tag.
  </video>
  <div class="video-hero-overlay">
    <h1 class="video-hero-title">{{ page.title }}</h1>
  </div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    const video = document.getElementById('heroVideo');
    if (video) {
      const playPromise = video.play();
      if (playPromise !== undefined) {
        playPromise.catch(error => {
          console.log('Autoplay was prevented by browser policy.');
        });
      }
    }
  });
</script>
{% elsif page.image_hero %}
<div class="image-hero">
    <img src="{{ page.image_hero | relative_url }}"></img>
  <div class="video-hero-overlay">
    <h1 class="video-hero-title">{{ page.title }}</h1>
  </div>
</div>
{% endif %}
